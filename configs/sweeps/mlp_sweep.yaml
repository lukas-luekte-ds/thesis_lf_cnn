run:
  n_runs: 2
  prune_name: mlp_test # is only used for pruning
  train_config: configs/train.yaml
  overrides:
    model.name: mlp

fixed:
  seed: 1
  train.huber_delta: 1.0

parameters:
  train.lr:
    values: [0.0001, 0.001, 0.01]

  train.weight_decay:
    values: [0.0, 0.0001, 0.001, 0.01]

  model.kwargs.dropout:
    values: [0.0, 0.3, 0.5]

  model.kwargs.use_layernorm:
    values: [true, false]

  train.loss_type:
    values: ["mae", "mse", "huber"]

  train.optimizer:
    values: ["adam", "adamw"]

  model.kwargs.activation:
    values: ["relu", "gelu"]

  model.kwargs.hidden_sizes:
    values:
      - [64]
      - [128]
      - [256]
      - [128, 128]
      - [256, 256]
      - [256, 128]
      - [64, 64, 64]
      - [256, 256, 256]
      - [512, 256, 128]
      - [256, 256, 128, 64]

optuna:
  n_runs: 50
  study_name: mlp_tpe
  storage: runs/mlp_tpe.db
  import_dir: runs/mlp_sweep
  output_root: runs
  exp_name: mlp_tpe