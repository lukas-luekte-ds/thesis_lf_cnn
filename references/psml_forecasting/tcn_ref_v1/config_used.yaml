exp_params:
  batch_size:
  - 50
  data_folder: /media/lll/T9/PSML/processed_dataset/forecasting
  external_features:
  - month_day
  - weekday
  - holiday
  - DHI
  - DNI
  - GHI
  - Dew Point
  - Solar Zenith Angle
  - Wind Speed
  - Relative Humidity
  - Temperature
