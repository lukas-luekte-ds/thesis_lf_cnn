  save_dir: ./../logs
model_params:
  classification_token:
  - first
  - last
  - all
  dropout:
  - 0.0
  kernel_size:
  - 3
  levels:
  - 4
  model_name: tcn
  nhid:
  - 600
trainer_params:
  gpus: 1
  max_epochs: 2
